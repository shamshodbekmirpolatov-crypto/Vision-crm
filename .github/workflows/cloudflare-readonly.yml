name: Cloudflare Read-only Bridge

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  issues: write

jobs:
  inspect-cloudflare:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Validate configured secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }

      - name: Inspect Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail

          verify="$(curl -sS             "https://api.cloudflare.com/client/v4/user/tokens/verify"             -H "Authorization: Bearer $CF_API_TOKEN"             -H "Content-Type: application/json")"

          test "$(jq -r '.success' <<<"$verify")" = "true" || {
            echo "Cloudflare token verification failed."
            jq '{success, errors, messages}' <<<"$verify"
            exit 1
          }

          projects="$(curl -sS             "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects"             -H "Authorization: Bearer $CF_API_TOKEN"             -H "Content-Type: application/json")"

          test "$(jq -r '.success' <<<"$projects")" = "true" || {
            echo "Unable to list Cloudflare Pages projects."
            jq '{success, errors, messages}' <<<"$projects"
            exit 1
          }

          project="$(jq -c '[.result[] | select(.name == "vision-crm")][0] // .result[0] // {}' <<<"$projects")"
          checked_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          token_status="$(jq -r '.result.status // "unknown"' <<<"$verify")"
          project_count="$(jq -r '.result | length' <<<"$projects")"
          project_name="$(jq -r '.name // "unknown"' <<<"$project")"
          subdomain="$(jq -r '.subdomain // "unknown"' <<<"$project")"
          production_branch="$(jq -r '.production_branch // "unknown"' <<<"$project")"
          deployment_url="$(jq -r '.latest_deployment.url // "unknown"' <<<"$project")"
          deployment_status="$(jq -r '.latest_deployment.latest_stage.status // "unknown"' <<<"$project")"
          deployment_stage="$(jq -r '.latest_deployment.latest_stage.name // "unknown"' <<<"$project")"
          deployment_created="$(jq -r '.latest_deployment.created_on // "unknown"' <<<"$project")"
          trigger_type="$(jq -r '.latest_deployment.deployment_trigger.type // "unknown"' <<<"$project")"
          trigger_branch="$(jq -r '.latest_deployment.deployment_trigger.metadata.branch // "unknown"' <<<"$project")"
          trigger_commit="$(jq -r '.latest_deployment.deployment_trigger.metadata.commit_hash // "unknown"' <<<"$project")"

          cat > /tmp/cloudflare-report.md <<EOF
          ## Cloudflare inspection

          - **Checked:** `$checked_at`
          - **Token:** `$token_status`
          - **Pages projects visible:** `$project_count`
          - **Project:** `$project_name`
          - **Subdomain:** `$subdomain`
          - **Production branch:** `$production_branch`
          - **Latest deployment stage:** `$deployment_stage`
          - **Latest deployment status:** `$deployment_status`
          - **Latest deployment created:** `$deployment_created`
          - **Latest deployment URL:** $deployment_url
          - **Trigger:** `$trigger_type`
          - **Trigger branch:** `$trigger_branch`
          - **Trigger commit:** `$trigger_commit`

          _Read-only report. No Cloudflare secret values are included._
          EOF

      - name: Post sanitized report to issue 1
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/cloudflare-report.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body
            });

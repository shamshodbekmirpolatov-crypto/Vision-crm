name: Deploy Fresh Vision CRM

on:
  push:
    paths:
      - ".cloudflare/new-site-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: vision-crm-fresh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build clean static bundle
        run: |
          set -euo pipefail
          npm run build
          test -f dist/app-current.js
          grep -q "Mother phone" dist/app-current.js
          grep -q "Father phone" dist/app-current.js
          grep -q "Date of birth (optional)" dist/app-current.js
          grep -q "Student phone (optional)" dist/app-current.js

      - name: Create Pages project if needed
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages project create "$PROJECT_NAME" --production-branch main || true

      - name: Deploy clean Pages project
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist --project-name "$PROJECT_NAME" --branch main
